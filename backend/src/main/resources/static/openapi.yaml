openapi: 3.0.3
info:
  title: Edu-java Platform API
  version: 1.0.0-rc1
  description: |
    API surface for the Chinese math smart-learning platform product rebase.
    MySQL remains the business authority; Neo4j is a versioned Published Graph
    projection. Course structure is data-driven through KnowledgeArea and
    KnowledgePoint APIs. RuleBeta remains the production personalization
    provider; research-model results are not presented as production behavior.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login and receive a JWT bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/register:
    post:
      summary: Register a platform student
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /users/me:
    get:
      summary: Read the current platform user profile
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /courses:
    get:
      summary: List courses accessible to the authenticated user
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /courses/{courseId}:
    get:
      summary: Read an authorized course
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /courses/{courseId}/knowledge-areas:
    get:
      summary: List active knowledge areas in an authorized course
      description: Frontend course hierarchy and graph grouping must consume this data instead of inferring chapters from knowledge codes.
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /courses/{courseId}/knowledge-points:
    get:
      summary: List active knowledge points in an authorized course
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exercise-units:
    get:
      summary: List authorized exercise units
      parameters:
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /exercise-units/{exerciseUnitId}/questions/next:
    get:
      summary: Read the next active question for an authorized exercise unit
      parameters: [ { $ref: '#/components/parameters/ExerciseUnitId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /questions/{questionId}/answers:
    post:
      summary: Submit an idempotent student answer
      parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSubmissionRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /courses/{courseId}/mastery:
    get:
      summary: Read student RuleBeta mastery, preserving UNKNOWN semantics
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /courses/{courseId}/recommendations:
    post:
      summary: Generate a recommendation snapshot bound to the active Published Graph
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /courses/{courseId}/recommendations/latest:
    get:
      summary: Read the latest student's recommendation snapshot
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /knowledge-points/{knowledgePointId}/learning-path:
    get:
      summary: Build a learning path from the active Published Graph
      parameters: [ { $ref: '#/components/parameters/KnowledgePointId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /courses/{courseId}/graph:
    get:
      summary: Query the active Published Graph projection
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teacher/courses:
    get:
      summary: List courses assigned to a teacher, or all courses for teaching administrators
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teacher/courses/{courseId}/analytics/overview:
    get:
      summary: Read authorized course overview analytics
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teacher/courses/{courseId}/analytics/knowledge-points:
    get:
      summary: Read authorized KnowledgePoint analytics
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teacher/courses/{courseId}/analytics/mastery-heatmap:
    get:
      summary: Read authorized student by KnowledgePoint heatmap
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teacher/courses/{courseId}/students/{studentId}/analytics:
    get:
      summary: Read an authorized enrolled student's analytics detail
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: studentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/courses/{courseId}/teachers:
    get:
      summary: List teacher assignments (SYSTEM_ADMIN or TEACH_ADMIN)
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create or update a teacher assignment (SYSTEM_ADMIN or TEACH_ADMIN)
      parameters: [ { $ref: '#/components/parameters/CourseId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/graph-versions:
    get:
      summary: List GraphVersions for a teaching-authorized course
      parameters:
        - name: courseId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a Draft GraphVersion for a teaching-authorized course
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/graph-versions/{graphVersionId}/validate:
    post:
      summary: Validate a Draft GraphVersion before publication
      parameters: [ { $ref: '#/components/parameters/GraphVersionId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/graph-versions/{graphVersionId}/publish:
    post:
      summary: Queue an approved GraphVersion for real Neo4j projection
      parameters: [ { $ref: '#/components/parameters/GraphVersionId' } ]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExerciseUnitId:
      name: exerciseUnitId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    KnowledgePointId:
      name: knowledgePointId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GraphVersionId:
      name: graphVersionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, format: password, maxLength: 128 }
    AnswerSubmissionRequest:
      type: object
      required: [selectedOptionKeys, clientRequestId]
      properties:
        selectedOptionKeys:
          type: array
          minItems: 1
          items: { type: string }
        durationMs: { type: integer, format: int64, minimum: 0 }
        clientRequestId: { type: string, maxLength: 128 }
    ApiEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        data: { nullable: true }
  responses:
    Success:
      description: Successful API envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
    Unauthenticated:
      description: Missing, expired, or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
    Forbidden:
      description: Caller is authenticated but not authorized for the resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
    Conflict:
      description: State conflict or an unavailable published projection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiEnvelope' }
